<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
    <span class="logo">RushLess</span>
</div>

<form class="form-box" id="studentForm">

    <h3>Student Account</h3>

    <label>Name</label>
    <input type="text" id="name" name="name">

    <label>Email</label>
    <input type="text" id="email" name="email" placeholder="student@example.com">

    <label>Roll Number</label>
    <input type="text" id="roll_no" name="roll_no">

    <label>Branch</label>
    <input type="text" id="branch" name="branch" placeholder="e.g. CSE">

    <label>Semester</label>
    <input type="text" id="semester" name="semester" placeholder="e.g. 5">

    <label>Password</label>
    <input type="password" id="password" name="password">

    <button type="submit" class="main-btn">Create Account</button>

    <p class="error" id="msg"></p>

</form>

<script src="script.js"></script>
</body>
</html>
