<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
    <span class="logo">RushLess</span>
    <a href="php/logout.php" class="logout">Logout</a>
</div>

<div class="page">

    <h2>Registered Outlets</h2>

    <div class="outlet-table" id="outletTable"></div>

</div>

<form class="form-box" id="outletForm">

    <h3 id="formTitle">Register an Outlet</h3>
    <p class="small-text">College account only. The outlet will log in with the email and password you set here.</p>

    <input type="hidden" id="outlet_id" name="outlet_id" value="">

    <label>Category</label>
    <select id="category" name="category">
        <option value="canteen">Canteen</option>
        <option value="stationary">Stationary</option>
    </select>

    <label>Outlet Name</label>
    <input type="text" id="outlet_name" name="outlet_name" placeholder="e.g. Main Campus Canteen">

    <label>Outlet Photo</label>
    <input type="file" id="outlet_photo" name="outlet_photo" accept="image/*">

    <label>Outlet Login Email</label>
    <input type="text" id="email" name="email" placeholder="canteen1@rushless.com">

    <label>Outlet Password</label>
    <input type="text" id="password" name="password">
    <p class="small-text" id="passNote"></p>

    <h4>Equipment</h4>
    <div id="equipList">

        <div class="menu-row">
            <input type="text" name="equip_name[]" class="equip-name" placeholder="e.g. Maggi Stove">
            <input type="number" name="equip_qty[]" class="equip-qty" placeholder="Units" min="1" value="1">
            <button type="button" class="remove-btn" onclick="removeEquip(this)">X</button>
        </div>

    </div>

    <button type="button" class="add-btn" onclick="addEquip()">+ Add Equipment</button>

    <h4>Menu</h4>
    <div id="menuList">

        <div class="menu-row">
            <input type="text" name="item_name[]" class="item-name" placeholder="Item name">
            <input type="number" name="item_price[]" class="item-price" placeholder="Price">
            <input type="number" name="item_prep[]" class="item-prep" placeholder="Prep min" step="0.5">
            <select name="item_equipment[]" class="item-equipment"><option value="">No equipment</option></select>
            <button type="button" class="remove-btn" onclick="removeItem(this)">X</button>
        </div>

    </div>

    <button type="button" class="add-btn" onclick="addItem()">+ Add Item</button>

    <button type="submit" class="main-btn" id="saveBtn">Register Outlet</button>
    <button type="button" class="add-btn" id="cancelBtn" onclick="resetForm()" style="display:none">Cancel edit</button>

    <p class="error" id="msg"></p>

</form>

<script src="script.js"></script>
</body>
</html>
